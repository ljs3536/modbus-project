version: "3.8"
services:
  # 1. 내가 직접 만든 Modbus 게이트웨이
  modbus-gateway:
    build: ./modbus-gateway
    ports:
      - "502:502"
    networks:
      - iiot-network

  # 2. Python 센서 에뮬레이터
  sensor-emulator:
    build: ./sensor-emulator
    depends_on:
      - modbus-gateway
    networks:
      - iiot-network

  # 3. Java Spring Boot 모니터링 시스템
  monitoring-app:
    build: ./app
    ports:
      - "8080:8080"
    depends_on:
      - modbus-gateway
    networks:
      - iiot-network

networks:
  iiot-network:
    driver: bridge
